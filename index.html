<script>

let categories=[
{name:"Bag",icon:"👜"},
{name:"Gifts",icon:"🎁"},
{name:"Toys",icon:"🧸"},
{name:"Events",icon:"🎉"},
{name:"Cosmetics",icon:"💄"},
{name:"Jewellery",icon:"💍"},
{name:"Stationary",icon:"✏️"},
{name:"Home Care",icon:"🧴"},
{name:"Object",icon:"🧾"}
];

let bill=[];
let billSaved=false;
let billNo=localStorage.getItem("billNo")||1;

/* =========================================================
   PRICING RULES
   ========================================================= */

const pricingRules = {
A:{
name:"A",
products:["Toys","Gifts"],
cuts:[5],
maxDiscount:15
},
B:{
name:"B",
products:["Bag","Events","Jewellery"],
cuts:[10],
maxDiscount:20
},
C:{
name:"C",
products:["Stationary","Home Care"],
cuts:[10,10],
maxDiscount:15
},
D:{
name:"D",
products:["Cosmetics"],
cuts:[10,10,10],
maxDiscount:10
},
E:{
name:"E",
products:["Object"],
cuts:[],
maxDiscount:null
}
};

function getPricingCategory(productCategory){

for(let key in pricingRules){

if(pricingRules[key].products.includes(productCategory)){
return key;
}

}

return "E";
}

function getPricingRule(productCategory){
return pricingRules[getPricingCategory(productCategory)];
}

function applyHaircuts(top,cuts){

let value=top;

cuts.forEach(percent=>{
value=value*(1-percent/100);
});

return value;
}

/*
  Find the next clean commercial price at or above the exact
  shown rate while staying within the user's ±4% allowance.
  Preference is larger, cleaner shop increments first.
*/
function getCleanShownRate(exact){

if(exact<=0) return 0;

if(Math.abs(exact-Math.round(exact))<0.000001){
exact=Math.round(exact);
}

/* already clean enough */
let preferredSteps=[100,50,20,10,5,1];

for(let step of preferredSteps){

let candidate=Math.ceil(exact/step)*step;

if(candidate<exact) continue;

let error=(candidate-exact)/exact;

if(error<=0.04+0.0000001){
return candidate;
}

}

/* fallback: exact value rounded to 2 decimals */
return Math.round(exact*100)/100;
}

function calculatePrice(purchase,cat){

purchase=Number(purchase)||0;

let rule=pricingRules[cat];

if(!rule) rule=pricingRules.E;

if(rule.name==="E"){

return {
category:"E",
purchase:purchase,
top:null,
exact:null,
shown:purchase,
cuts:[],
error:0,
maxDiscount:null
};

}

let top=purchase*2;
let exact=applyHaircuts(top,rule.cuts);
let shown=getCleanShownRate(exact);
let error=exact ? ((shown-exact)/exact)*100 : 0;

return {
category:rule.name,
purchase:purchase,
top:top,
exact:exact,
shown:shown,
cuts:rule.cuts,
error:error,
maxDiscount:rule.maxDiscount
};

}

/* =========================================================
   PRICING CALCULATOR UI
   ========================================================= */

const Pricing = {

open(){

let html=`
<h2>Pricing Calculator</h2>

<div class="smallBox">
<b>Purchase → Top → Category haircut → Exact shown rate → Clean shown rate</b><br>
Clean shown rate must stay within <b>4%</b> above the calculated rate.
</div>

Purchase Price ₹<br>
<input type="number" id="pricePurchase" step="0.01" oninput="Pricing.calculate()">

<br><br>

Category<br>
<select id="priceCategory" onchange="Pricing.calculate()">
<option value="A">A — Toys, Gifts</option>
<option value="B">B — Bags, Events, Jewellery</option>
<option value="C">C — Stationary, Home Care</option>
<option value="D">D — Cosmetics</option>
<option value="E">E — Object</option>
</select>

<div id="priceResult"></div>

<br>
<button onclick="Pricing.close()">Close</button>
`;

let screen=document.getElementById("pricingScreen");
screen.innerHTML=html;
screen.style.display="block";

document.getElementById("pricePurchase").focus();

},

close(){
document.getElementById("pricingScreen").style.display="none";
},

calculate(){

let purchase=Number(document.getElementById("pricePurchase").value)||0;
let cat=document.getElementById("priceCategory").value;
let result=document.getElementById("priceResult");

if(!purchase){
result.innerHTML="";
return;
}

let r=calculatePrice(purchase,cat);

if(cat==="E"){

result.innerHTML=`
<div class="smallBox good">
<b>Category E — Object</b><br><br>
Entered Rate / Shown Rate: <b>₹${formatMoney(r.shown)}</b><br>
No automatic Top or haircut is applied.
</div>
`;

return;
}

let cutsHTML="";

let running=r.top;

r.cuts.forEach((p,index)=>{
running=running*(1-p/100);
cutsHTML+=`−${p}% → ₹${formatMoney(running)}<br>`;
});

let statusClass=r.error<=4 ? "good" : "error";

result.innerHTML=`
<div class="smallBox">
Purchase Cost: <b>₹${formatMoney(r.purchase)}</b><br>
Top (×2): <b>₹${formatMoney(r.top)}</b>
</div>

<div class="smallBox">
<b>Category ${r.category}</b><br><br>
${cutsHTML}
Exact Calculated Rate: <b>₹${formatMoney(r.exact)}</b>
</div>

<div class="smallBox ${statusClass}">
<b>RECOMMENDED SHOWN RATE: ₹${formatMoney(r.shown)}</b><br>
Difference from exact: ${r.error.toFixed(2)}%<br>
4% allowance: ${r.error<=4 ? "Within limit ✓" : "Outside limit"}
</div>

<div class="smallBox">
Maximum discount for Category ${r.category}: <b>${r.maxDiscount}%</b><br>
At shown rate ₹${formatMoney(r.shown)}, maximum discount value:
<b>₹${formatMoney(r.shown*r.maxDiscount/100)}</b>
</div>
`;

}

};

function formatMoney(value){

return Number(value).toLocaleString("en-IN",{
minimumFractionDigits:0,
maximumFractionDigits:2
});

}

/* =========================================================
   BILLING
   ========================================================= */

function renderCategories(){

let grid=document.getElementById("categories");
grid.innerHTML="";

categories.forEach(cat=>{

let div=document.createElement("div");
div.className="category";

div.innerHTML="<span>"+cat.icon+"</span>"+cat.name;

div.onclick=function(){
openPopup(cat.name);
};

grid.appendChild(div);

});
}

function openPopup(cat){

document.getElementById("popupCategory").innerText=cat;

document.getElementById("rateInput").value="";
document.getElementById("qtyInput").value=1;

document.getElementById("itemPopup").style.display="flex";

document.getElementById("rateInput").focus();

}

function outsideTap(e){

if(e.target.id!=="itemPopup") return;

let rate=Number(document.getElementById("rateInput").value);
let qty=Number(document.getElementById("qtyInput").value)||1;

if(rate>0){

let cat=document.getElementById("popupCategory").innerText;

bill.push({cat,rate,qty});

renderBill();
}

document.getElementById("itemPopup").style.display="none";

}

/*
  Maximum permitted discount for the current bill.
  A-D are category-controlled.
  E remains manually controlled because it has no pricing formula.
*/
function getBillDiscountLimit(){

let limit=0;

bill.forEach(item=>{

let rule=getPricingRule(item.cat);
let line=item.rate*item.qty;

if(rule.maxDiscount===null){
/* Category E has no automatic pricing/discount cap. */
limit+=line;
return;
}

limit+=line*(rule.maxDiscount/100);

});

return limit;
}

function getDiscountBreakdown(discount){

let breakdown=[];
let controlledSubtotal=0;
let totalSubtotal=0;

bill.forEach(item=>{
totalSubtotal+=item.rate*item.qty;
});

let requested=Number(discount)||0;

if(!requested){
return {
breakdown:[],
limit:getBillDiscountLimit(),
valid:true
};
}

/*
  Allocate the requested bill discount proportionally across
  category-controlled lines for display/validation.
  E is excluded from automatic limit control.
*/
let remaining=requested;

let controlledItems=bill.filter(item=>getPricingRule(item.cat).maxDiscount!==null);

let controlledTotal=controlledItems.reduce((sum,item)=>sum+(item.rate*item.qty),0);

controlledItems.forEach(item=>{

let line=item.rate*item.qty;
let share=controlledTotal ? requested*(line/controlledTotal) : 0;
let rule=getPricingRule(item.cat);
let max=line*rule.maxDiscount/100;

breakdown.push({
category:item.cat,
categoryCode:rule.name,
line:line,
requested:share,
max:max
});

controlledSubtotal+=line;

});

let limit=getBillDiscountLimit();

return {
breakdown:breakdown,
limit:limit,
valid:requested<=limit+0.000001
};

}

function renderDiscountStatus(discount){

let box=document.getElementById("discountStatus");

if(!box) return;

if(!bill.length || !discount){
box.innerHTML="";
return;
}

let result=getDiscountBreakdown(discount);

if(result.valid){

let text="Discount allowed ✓";

if(result.breakdown.length){
text+=" | Max for controlled categories: ₹"+formatMoney(result.limit);
}

box.innerHTML=`<div class="smallBox good">${text}</div>`;

}else{

box.innerHTML=`
<div class="smallBox error">
<b>Discount exceeds category limit.</b><br>
Maximum allowed: ₹${formatMoney(result.limit)}<br>
Requested: ₹${formatMoney(discount)}
</div>
`;

}

}

function isDiscountAllowed(){

let discount=Number(document.getElementById("discount").value)||0;

if(discount<0){
alert("Discount cannot be negative.");
return false;
}

if(!discount){
return true;
}

if(!bill.length){
alert("Add items first.");
return false;
}

let result=getDiscountBreakdown(discount);

if(!result.valid){

alert(
"Discount exceeds category limit.\n\n"+
"Maximum allowed: ₹"+formatMoney(result.limit)+
"\nRequested: ₹"+formatMoney(discount)
);

return false;
}

return true;

}

function renderBill(){

let itemsDiv=document.getElementById("items");
itemsDiv.innerHTML="";

let total=0;

bill.forEach((item,index)=>{

let line=item.rate*item.qty;
total+=line;

let rule=getPricingRule(item.cat);

let div=document.createElement("div");

div.innerText=
item.cat+" "+item.rate+" × "+item.qty+
" = "+line+
" ["+rule.name+"]";

div.onclick=function(){
editOptions(index);
};

itemsDiv.appendChild(div);

});

let discount=Number(document.getElementById("discount").value)||0;

let finalTotal=total-discount;

if(finalTotal<0){
finalTotal=0;
}

if(document.getElementById("round").checked){
finalTotal=Math.round(finalTotal);
}

let display="";

if(discount>0){
display=
"Subtotal ₹"+formatMoney(total)+
"<br>Discount ₹"+formatMoney(discount)+
"<br><b>Total ₹"+formatMoney(finalTotal)+"</b>";
}else{
display="<b>Total ₹"+formatMoney(total)+"</b>";
}

document.getElementById("total").innerHTML=display;

renderDiscountStatus(discount);

}

function editOptions(index){

let action=prompt("Type:\n1 Edit\n2 Delete");

if(action==="1"){

let item=bill[index];

let newRate=prompt("Rate",item.rate);
if(newRate===null)return;

let newQty=prompt("Qty",item.qty);
if(newQty===null)return;

bill[index].rate=Number(newRate);
bill[index].qty=Number(newQty);

}

if(action==="2"){
bill.splice(index,1);
}

renderBill();

}

function getPurchaseCostEstimate(rate, productCategory){

let rule=getPricingRule(productCategory);

if(!rule || rule.name==="E") return null;

let factor=2;
rule.cuts.forEach(percent=>{
factor*=1-(percent/100);
});

if(!factor) return null;

return Number(rate)/factor;
}

function getPricingSnapshot(item){

let rule=getPricingRule(item.cat);

if(!rule || rule.name==="E"){
return {
categoryCode:"E",
categoryName:"Object",
cuts:[],
maxDiscount:null,
purchaseCostPerUnit:null,
purchaseCostTotal:null
};
}

let costPerUnit=getPurchaseCostEstimate(item.rate,item.cat);

return {
categoryCode:rule.name,
categoryName:item.cat,
cuts:rule.cuts.slice(),
maxDiscount:rule.maxDiscount,
purchaseCostPerUnit:costPerUnit,
purchaseCostTotal:costPerUnit*item.qty
};
}

function saveBill(customerPhone=""){

if(billSaved){
/* If WhatsApp number is supplied after a previous save, attach it. */
if(customerPhone){
let bills=JSON.parse(localStorage.getItem("bills")||"[]");
let last=bills[bills.length-1];
if(last && last.billNo===String(billNo-1).padStart(4,'0')){
last.customerPhone=customerPhone;
localStorage.setItem("bills",JSON.stringify(bills));
}
}
return true;
}

if(!bill.length){
return false;
}

if(!isDiscountAllowed()){
return false;
}

let bills=JSON.parse(localStorage.getItem("bills")||"[]");
let currentBillNo=String(billNo).padStart(4,'0');
let now=new Date().toISOString();
let discount=Number(document.getElementById("discount").value)||0;
let subtotal=bill.reduce((sum,item)=>sum+(item.rate*item.qty),0);
let finalTotal=Math.max(0,subtotal-discount);

if(document.getElementById("round").checked){
finalTotal=Math.round(finalTotal);
}

let storedItems=bill.map(item=>({
...item,
pricingSnapshot:getPricingSnapshot(item)
}));

bills.push({
billNo:currentBillNo,
date:now,
items:storedItems,
discount:discount,
subtotal:subtotal,
finalTotal:finalTotal,
rounded:document.getElementById("round").checked,
customerPhone:customerPhone || ""
});

localStorage.setItem("bills",JSON.stringify(bills));

billNo++;
localStorage.setItem("billNo",billNo);

billSaved=true;

updateDashboard();

return true;

}

function manualSave(){

if(!bill.length){
alert("Add items first.");
return;
}

if(!isDiscountAllowed()){
return;
}

saveBill();

if(billSaved){
alert("Bill Saved");
}

}

function updateDashboard(){

let bills=JSON.parse(localStorage.getItem("bills")||"[]");

let today=new Date().toDateString();

let sales=0;
let count=0;
let knownProfit=0;

bills.forEach(b=>{

let d=new Date(b.date).toDateString();

if(d===today){

count++;

b.items.forEach(i=>{
sales+=i.rate*i.qty;
});

sales-=b.discount||0;
knownProfit+=getBillFinancials(b).knownProfit;

}

});

document.getElementById("dashboard").innerText=
"Today's Sales ₹"+formatMoney(sales)+" | Bills "+count;

}

function getBillFinancials(billRecord){

let subtotal=0;
let knownCost=0;
let objectSales=0;
let knownSales=0;

billRecord.items.forEach(item=>{
let line=item.rate*item.qty;
subtotal+=line;

let snap=item.pricingSnapshot;

if(snap && snap.categoryCode==="E"){
objectSales+=line;
}else{
knownSales+=line;
if(snap && snap.purchaseCostTotal!=null){
knownCost+=Number(snap.purchaseCostTotal)||0;
}else{
let estimated=getPurchaseCostEstimate(item.rate,item.cat);
if(estimated!=null){
knownCost+=estimated*item.qty;
}
}
}
});

let discount=Number(billRecord.discount)||0;
let finalTotal=billRecord.finalTotal!=null
?Number(billRecord.finalTotal)
:Math.max(0,subtotal-discount);

/* Discount is allocated proportionally across the bill for profit analysis. */
let knownNetSales=knownSales;
if(subtotal>0){
knownNetSales=knownSales-(discount*(knownSales/subtotal));
}

let knownProfit=knownNetSales-knownCost;

return {
subtotal,
discount,
finalTotal,
knownCost,
knownSales,
objectSales,
knownProfit
};
}

function money(value){
return "₹"+formatMoney(Number(value)||0);
}

const Records = {

open(){
this.render();
},

close(){
document.getElementById("recordsScreen").style.display="none";
},

render(){

let bills=JSON.parse(localStorage.getItem("bills")||"[]");
let screen=document.getElementById("recordsScreen");

if(!bills.length){
 screen.innerHTML=`<h2>Sales Records</h2><div class="smallBox">No bills recorded yet.</div><button onclick="Records.close()">Close</button>`;
 screen.style.display="block";
 return;
}

let totalRevenue=0;
let totalKnownProfit=0;
let totalObjectSales=0;
let todayRevenue=0;
let todayKnownProfit=0;
let todayBills=0;
let today=new Date().toDateString();

bills.forEach(b=>{
let f=getBillFinancials(b);
totalRevenue+=f.finalTotal;
totalKnownProfit+=f.knownProfit;
totalObjectSales+=f.objectSales;

if(new Date(b.date).toDateString()===today){
 todayBills++;

function exportExcel(){

let bills=JSON.parse(localStorage.getItem("bills")||"[]");

if(!bills.length){
alert("No bills recorded yet.");
return;
}

let csv="BillNo,Date,CustomerWhatsApp,Category,CategoryCode,Rate,Qty,LineAmount,DiscountAllocated,FinalLineAmount,EstimatedCost,EstimatedProfit\n";

bills.forEach(b=>{
let f=getBillFinancials(b);
let subtotal=f.subtotal;

b.items.forEach(i=>{
let line=i.rate*i.qty;
let allocated=subtotal ? (Number(b.discount)||0)*(line/subtotal) : 0;
let finalLine=line-allocated;
let snap=i.pricingSnapshot || getPricingSnapshot(i);
let cost=snap.categoryCode==="E" ? "" : (snap.purchaseCostTotal!=null ? snap.purchaseCostTotal : getPurchaseCostEstimate(i.rate,i.cat)*i.qty);
let profit=snap.categoryCode==="E" ? "" : (finalLine-Number(cost));

let row=[
 b.billNo,
 b.date,
 b.customerPhone||"",
 i.cat,
 snap.categoryCode,
 i.rate,
 i.qty,
 line,
 allocated,
 finalLine,
 cost,
 profit
];

csv+=row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")+"\n";
});
});

let blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="juggad_sales_records.csv";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);

}

saveInventory(cat, tag, cost, qty);
}


function saveInventory(cat, tag, cost, qty){

let data = JSON.parse(localStorage.getItem("inventory") || "[]");

// find existing
let existing = data.find(d => d.category===cat && d.tag===tag);

if(existing){

let merge = confirm(
"Existing:\n"+cat+" "+tag+
"\nQty:"+existing.qty+" Cost:"+existing.cost+
"\n\nMerge?"
);

if(merge){
existing.qty += qty;
existing.cost += cost;
}else{
data.push({
category:cat,
tag:tag,
qty:qty,
cost:cost,
date:new Date()
});
}

}else{
data.push({
category:cat,
tag:tag,
qty:qty,
cost:cost,
date:new Date()
});
}

localStorage.setItem("inventory", JSON.stringify(data));

alert("Saved "+cat+" "+tag+" Qty:"+qty);
}

addTag(){

let newTag = prompt("Enter tag (start with @)");
if(!newTag) return;

let tagMap = JSON.parse(localStorage.getItem("tagMap"));

if(!tagMap[this.category]){
tagMap[this.category]=["@etc"];
}

tagMap[this.category].push(newTag);

localStorage.setItem("tagMap", JSON.stringify(tagMap));

},

selectTag(tag){

this.tag=tag;

let html=`
<h3>${this.category} → ${this.tag}</h3>

Rate ₹<br>
<input type="number" id="invRate"><br><br>

Qty<br>
<input type="number" id="invQty" value="1"><br><br>

<button onclick="Inventory.save()">Save</button>
<br><br>

<button onclick="Inventory.selectCategory('${this.category}')">Back</button>

if(existing){
existing.qty += qty;
existing.cost += total;
}else{
data.push({
category:this.category,
tag:this.tag,
qty:qty,
cost:total
});
}

history.push({

tag:this.tag,

cost:total,
date:new Date()
});

const History = {

view(){

let data = JSON.parse(localStorage.getItem("history") || "[]");

if(data.length===0){
alert("No history");
return;
}

// reverse for latest first
let list = data.slice().reverse();

let html = "<h2>History</h2>";

let monthTotal = 0;
let currentMonth = new Date().toISOString().slice(0,7);

list.forEach(d=>{

if(m===currentMonth){
monthTotal += d.cost;
}
});

html += `<b>This Month Total: ₹${monthTotal}</b><hr>`;

// ===== Group by Date =====
let lastDate = "";

list.forEach((d,i)=>{

let dateObj = new Date(d.date);
let dateStr = dateObj.toDateString();

if(dateStr !== lastDate){
html += `<h3>${dateStr}</h3>`;
lastDate = dateStr;
}

let rate = (d.cost / d.qty).toFixed(2);

html += `
<div style="border-bottom:1px solid #ddd;padding:8px;">
<b>${d.category} → ${d.tag}</b><br>

Bought ${d.qty} pcs @ ₹${rate} = ₹${d.cost}<br>

<small>${dateObj.toLocaleTimeString()}</small><br>

<button onclick="History.del(${data.length-1-i})">Delete</button>
</div>
`;
});

html += `<br><button onclick="History.close()">Close</button>`;

let screen = document.getElementById("historyScreen");
screen.innerHTML = html;
screen.style.display = "block";
},

del(index){

let data = JSON.parse(localStorage.getItem("history")||[]);

if(!confirm("Delete entry?")) return;

data.splice(index,1);

localStorage.setItem("history",JSON.stringify(data));

this.view();
},

close(){
document.getElementById("historyScreen").style.display="none";
}
};
